<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinGSEC |    Login</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css">
    <script src="intro.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <section class="brand-intro" aria-label="Abertura do FinGSEC">
        <div class="brand-intro-content">
            <img src="assets/img/baner.png" alt="FinGSEC" class="brand-intro-logo" fetchpriority="high" width="320" height="320">
            <span class="brand-intro-rule" aria-hidden="true"></span>
        </div>
        <button class="brand-intro-skip" type="button">Ir para o login <span aria-hidden="true">→</span></button>
    </section>
    <main class="auth-container">
        <div class="auth-card">
        
            <div class="top-login">
                <img src="assets/img/baner.png" class="logo" alt="FinGSEC">
            </div>
            
            <div id="formLogin" class="auth-form active">
                <h1 class="auth-title">Bem-vindo!</h1>
                <p class="auth-subtitle">Entre para acessar sua conta.</p>
                <form id="loginForm">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input type="email" id="loginEmail" placeholder="Digite seu e-mail">
                        </div>
                        <span id="loginEmailError" class="error-msg"></span>
                    </div>
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input type="password" id="loginPassword" placeholder="Digite sua senha">
                            <button type="button" class="toggle-password" data-target="loginPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span id="loginPasswordError" class="error-msg"></span>
                    </div>

                    <div class="login-options">
                        <label><input type="checkbox"> Lembrar-me</label>
                        <a href="#">Esqueceu a senha?</a>
                    </div>

                    <button class="btn btn-primary" type="submit">Entrar</button>
                </form>

                <p class="local-notice">Acesse sua conta para salvar seus dados no servidor.</p>

                <div class="social-login" hidden>
                    <button><i class="fab fa-google"></i></button>
                    <button><i class="fab fa-github"></i></button>
                    <button><i class="fab fa-facebook-f"></i></button>
                </div>

                <p class="auth-switch">
                    Não possui conta?
                    <button id="goToCadastro" class="link-btn" type="button">Criar Conta</button>
                </p>
            </div>

            <!-- CADASTRO -->
            <div id="formCadastro" class="auth-form">
                <h1 class="auth-title">Criar Conta</h1>
                <p class="auth-subtitle">Crie sua conta gratuitamente.</p>

                <form id="cadastroForm">
                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-user input-icon"></i>
                            <input id="cadastroNome" type="text" placeholder="Nome completo">
                        </div>
                        <span id="cadastroNomeError" class="error-msg"></span>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-envelope input-icon"></i>
                            <input id="cadastroEmail" type="email" placeholder="Digite seu e-mail">
                        </div>
                        <span id="cadastroEmailError" class="error-msg"></span>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input id="cadastroPassword" type="password" placeholder="Crie uma senha">
                            <button type="button" class="toggle-password" data-target="cadastroPassword">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span id="cadastroPasswordError" class="error-msg"></span>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <i class="fas fa-lock input-icon"></i>
                            <input id="cadastroConfirm" type="password" placeholder="Confirmar senha">
                            <button type="button" class="toggle-password" data-target="cadastroConfirm">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                        <span id="cadastroConfirmError" class="error-msg"></span>
                    </div>

                    <button class="btn btn-primary" type="submit">Criar Conta</button>
                </form>

                <p class="auth-switch">
                    Já possui conta?
                    <button id="goToLogin" class="link-btn" type="button">Entrar</button>
                </p>
            </div>

            <section id="passwordReset" hidden><h1 class="auth-title">Nova senha</h1><form id="resetPasswordForm"><label for="newPassword">Escolha uma senha</label><div class="input-wrapper"><input id="newPassword" type="password" minlength="6" maxlength="128" required autocomplete="new-password"></div><p id="resetStatus" role="status"></p><button class="btn btn-primary" type="submit">Salvar senha</button></form></section>
            <!-- SUCESSO -->
            <div id="successMessage" class="success-message">
                <i class="fas fa-circle-check"></i>
                <p>Conta criada com sucesso!!</p>
            </div>

        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
    <script src="supabase-config.js"></script>
    <script src="cloud.js"></script>
    <script src="login.js"></script>
    <script src="finance-background.js"></script>
</body>

</html>
